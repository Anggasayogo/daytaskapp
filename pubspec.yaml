name: daytaskapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  get_it: ^7.7.0
  equatable: ^2.0.5

  # Networking
  dio: ^5.7.0
  talker_bloc_logger: ^4.7.2
  talker_dio_logger: ^4.7.2

  # Navigation
  go_router: ^14.2.8

  # UI Kits & Widgets
  flutter_svg: ^2.0.10+1
  easy_date_timeline: ^1.1.3
  d_chart: ^2.6.9

  # Tools
  flutter_launcher_icons: ^0.14.2
  intl: ^0.19.0
  path_provider: ^2.1.5

  # Permission (stabil untuk Android + Flutter 3.24)
  permission_handler: ^11.3.0

  # Shared Preferences (kompatibel penuh dan tanpa error kotlin)
  shared_preferences: ^2.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true


flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
